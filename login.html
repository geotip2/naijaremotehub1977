<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#15803d">
  <meta name="description" content="NaijaRemoteHub — Learn remote skills, earn with referrals, grow your income.">
  <title>Login | NaijaRemoteHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-800">
<header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-slate-200">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
    <a href="index.html" class="flex items-center gap-2 min-w-0">
      <span class="w-10 h-10 rounded-xl bg-green-700 text-white grid place-items-center font-black text-xl">N</span>
      <span class="font-extrabold tracking-tight text-green-800 text-lg sm:text-xl">NaijaRemoteHub</span>
    </a>
    <nav class="flex items-center gap-1 sm:gap-2 text-sm">
      <a href="index.html" class="px-2 py-2 rounded-lg hover:bg-green-50">Home</a>
      <a id="navDashboard" href="dashboard.html" class="hidden px-2 py-2 rounded-lg hover:bg-green-50">Dashboard</a>
      <a id="navAdmin" href="admin.html" class="hidden px-2 py-2 rounded-lg hover:bg-green-50">Admin</a>
      <a id="navLogin" href="login.html" class="px-2 py-2 rounded-lg hover:bg-green-50">Login</a>
      <button id="navLogout" class="hidden px-2 py-2 rounded-lg text-red-700 hover:bg-red-50" onclick="logout()">Logout</button>
    </nav>
  </div>
</header>
<main>
<section class="min-h-[75vh] flex items-center justify-center px-4 py-12"><div class="w-full max-w-md bg-white rounded-3xl shadow-soft p-6 sm:p-8"><div class="text-center"><div class="mx-auto w-14 h-14 bg-green-100 text-green-800 rounded-2xl grid place-items-center text-2xl font-black">N</div><h1 class="text-2xl font-black mt-4">Welcome to NaijaRemoteHub</h1><p class="text-slate-500 text-sm mt-1">Sign in to your account</p></div><form id="loginForm" class="mt-6 space-y-4" onsubmit="login(event)"><div><label class="block text-sm font-bold mb-1" for="loginEmail">Email</label><input id="loginEmail" class="field" type="email" autocomplete="email" required></div><div><label class="block text-sm font-bold mb-1" for="loginPassword">Password</label><input id="loginPassword" class="field" type="password" autocomplete="current-password" required></div><button id="loginSubmit" class="btn btn-green w-full" type="submit">Login</button><div id="loginError" class="notice error"></div></form></div></section>
</main>
<footer class="bg-slate-900 text-slate-300 mt-16"><div class="max-w-6xl mx-auto px-4 py-8 flex flex-col sm:flex-row justify-between gap-3 text-sm"><p>© <span id="year"></span> NaijaRemoteHub. Learn. Earn. Grow.</p><p>Build skills. Create opportunities.</p></div></footer>
<script>document.getElementById("year").textContent = new Date().getFullYear();</script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://js.paystack.co/v1/inline.js"></script>
<script src="js/firebase.js"></script><script src="js/common.js"></script><script src="js/auth.js"></script>
</body>
</html>
